<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title>Zadanie animacja</title>
    <style>
        .box{
            width: 50px;
            height: 50px;
            background-color: red;
            position: absolute;
        }
    </style>
</head>
<body>

    <div class = "box"></div>

    <script>
    const box = document.querySelector('.box');
    let width = window.innerWidth;
    let height = window.innerHeight;

    box.style.bottom = '0px';
    box.style.left = '0px';

    let x = 0;
    let y = 0;

    let speedX = 5;
    let speedY = 5;

    setInterval(() => {

        x += speedX ;
        y += speedY ;

        if (x >= window.innerWidth - 50 || x <= 0) {
            box.style.backgroundColor = `rgb(${Math.floor(Math.random() * 256)}, ${Math.floor(Math.random() * 256)}, ${Math.floor(Math.random() * 256)})`;
            speedX *= -1;
        }

        if (y >= window.innerHeight - 50 || y <= 0) {
            box.style.backgroundColor = `rgb(${Math.floor(Math.random() * 256)}, ${Math.floor(Math.random() * 256)}, ${Math.floor(Math.random() * 256)})`;
            speedY *= -1;
        }

        box.style.left = x + 'px';
        box.style.bottom = y + 'px';



    }, 10);
</script>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <title>Zadanie animacja</title>

    <style>
        .box {
            width: 50px;
            height: 50px;
            background-color: red;
            position: absolute;
        }
    </style>
</head>

<body>

    <div class="box"></div>

    <script>

        let x = 0;
        let y = 0;

        let speedX = 5;
        let speedY = 5;

        $(".box").css({
            bottom: "0px",
            left: "0px"
        });

        setInterval(() => {

            x += speedX;
            y += speedY;

            if (x >= $(window).width() - 50 || x <= 0) {

                $(".box").css(
                    "background-color",
                    `rgb(${Math.floor(Math.random() * 256)}, 
                         ${Math.floor(Math.random() * 256)}, 
                         ${Math.floor(Math.random() * 256)})`
                );

                speedX *= -1;
            }

            if (y >= $(window).height() - 50 || y <= 0) {

                $(".box").css(
                    "background-color",
                    `rgb(${Math.floor(Math.random() * 256)}, 
                         ${Math.floor(Math.random() * 256)}, 
                         ${Math.floor(Math.random() * 256)})`
                );

                speedY *= -1;
            }

            $(".box").css({
                left: x + "px",
                bottom: y + "px"
            });

        }, 10);

    </script>

</body>
</html>
